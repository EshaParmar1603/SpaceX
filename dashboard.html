<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="SpaceX Mission Control Dashboard displaying launch and mission information.">

    <title>SpaceX Mission</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">

        <!-- Background -->
        <img
            src="page2.jpg"
            alt="SpaceX mission background"
            class="dashboard-image"
        >

        <!-- Overlay -->
        <div class="overlay">

            <!-- Header -->
            <header class="header">

                <div class="header-content">
                    <p class="subtitle">MISSION CONTROL</p>
                    <h1>SPACEX</h1>
                    <p class="description">
                        Explore SpaceX launches and Mission Details.
                    </p>
                </div>

                <div class="actions">

                    <button
                        type="button"
                        class="search"
                        id="search-btn"
                    >
                        Search
                    </button>

                    <button
                        type="button"
                        class="filter"
                        id="filter-btn"
                    >
                        Filter By
                    </button>

                </div>

            </header>

            <!-- Rocket Cards -->
            <section
                class="rocket-container"
                id="rocket-container"
                aria-label="SpaceX missions"
            >
                <!-- Cards will be generated dynamically using JavaScript -->
            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>git
